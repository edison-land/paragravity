name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: py_compile (${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both the CLT-provided system interpreter (3.9) and the
        # Homebrew interpreter the runner defaults to (3.14).
        python: ["/usr/bin/python3", "python3"]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: "${{ matrix.python }} -m py_compile bin/paragravity"

  tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test suite
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m unittest discover -s tests -v

  tests-system-python:
    # The CLT system interpreter is the default `python3` many users get —
    # run the full suite on it, not just a syntax check.
    name: Unit tests (macOS system python3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite on /usr/bin/python3
        run: /usr/bin/python3 -m unittest discover -s tests -v

  dashboard:
    name: Dashboard typecheck & build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install & build
        working-directory: dashboard
        run: |
          npm ci
          npm run build

  shellcheck:
    name: shellcheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint install.sh
        run: shellcheck install.sh

  brew-audit:
    name: brew audit --strict
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit formula from a scratch tap
        run: |
          brew tap-new --no-git ci/local
          TAP="$(brew --repository)/Library/Taps/ci/homebrew-local"
          mkdir -p "$TAP/Formula"
          cp Formula/paragravity.rb "$TAP/Formula/paragravity.rb"
          brew audit --strict --formula ci/local/paragravity
