name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: py_compile (${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both the CLT-provided system interpreter (3.9) and the
        # Homebrew interpreter the runner defaults to (3.14).
        python: ["/usr/bin/python3", "python3"]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          ${{ matrix.python }} -m py_compile bin/paragravity
          ${{ matrix.python }} -m py_compile bin/web_server.py

  tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test suite
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m unittest discover -s tests -v

  shellcheck:
    name: shellcheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint shell scripts
        run: shellcheck install.sh bin/pgrav

  brew-audit:
    name: brew audit --strict
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit formula from a scratch tap
        run: |
          brew tap-new --no-git ci/local
          TAP="$(brew --repository)/Library/Taps/ci/homebrew-local"
          mkdir -p "$TAP/Formula"
          cp Formula/paragravity.rb "$TAP/Formula/paragravity.rb"
          brew audit --strict --formula ci/local/paragravity
